# H2 Database Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:${H2_DB_URL:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_DB_USERNAME:sa}
spring.datasource.password=${H2_DB_PASSWORD:password}
spring.sql.init.platform=h2
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.datasource.hikari.maximum-pool-size=${H2_DB_POOL_SIZE:10}
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
